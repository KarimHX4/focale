<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focale — Conception optique</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--panel:#fff;--panel2:#f7f9fb;--fg:#1c2430;--mut:#6b7686;--line:#dde3ea;--acc:#2563eb;--acc2:#e3ecfd;--grid:#eef1f5;--sel:#eaf1ff;--lens:rgba(96,165,250,.20);--lensE:#3b82f6;--warn:#b45309;--err:#dc2626;--ok:#15803d;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
[data-theme=dark]{color-scheme:dark;--bg:#0d1117;--panel:#151b23;--panel2:#11161d;--fg:#e6e9ee;--mut:#8b96a5;--line:#2a323d;--acc:#5b9cff;--acc2:#1b2c48;--grid:#1f2630;--sel:#18263b;--lens:rgba(96,165,250,.16);--lensE:#60a5fa;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
button,select,input{font:inherit;color:inherit}
select option,select optgroup{background:var(--panel);color:var(--fg)}

#app{display:grid;grid-template-rows:46px 1fr 26px;height:100vh}
/* header */
header{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:8px;white-space:nowrap}
.logo svg{flex:none}
.logo small{font-weight:500;color:var(--mut);font-size:11px}
.tb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border:1px solid transparent;border-radius:7px;background:none;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--panel2);border-color:var(--line)}
.tb.pri{background:var(--acc);color:#fff}
.tb.pri:hover{filter:brightness(1.08);background:var(--acc)}
.tb svg{width:16px;height:16px;flex:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.grow{flex:1}
.dd{position:relative}
.menu{position:absolute;top:34px;left:0;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:5px;min-width:250px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--acc2)}
.menu .kb{float:right;color:var(--mut);font-size:11px;margin-left:16px}
.drop{position:fixed;inset:0;background:rgba(37,99,235,.12);border:3px dashed var(--acc);z-index:300;display:none;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--acc)}
.drop.on{display:flex}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 9px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--acc2);color:var(--acc);font-weight:600}
/* workspace */
#ws{display:grid;grid-template-columns:268px minmax(320px,1fr) 6px var(--anw,47%);min-height:0}
#side{overflow:auto;border-right:1px solid var(--line);background:var(--panel2);padding:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.card h3{margin:0;padding:8px 10px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.card h3 .chev{margin-left:auto;transition:transform .15s}
.card.closed h3 .chev{transform:rotate(-90deg)}
.card.closed .cb{display:none}
.cb{padding:2px 10px 10px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row label{flex:1;color:var(--mut)}
.in{height:26px;border:1px solid var(--line);border-radius:6px;padding:0 7px;background:var(--panel);min-width:0}
.in:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
.mini{width:74px}
table.mt{width:100%;border-collapse:collapse}
table.mt td,table.mt th{padding:2px 3px;text-align:left}
table.mt th{font-weight:500;color:var(--mut);font-size:11px}
table.mt input.in{width:100%}
.x{border:0;background:none;color:var(--mut);cursor:pointer;padding:2px 5px;border-radius:5px}
.x:hover{color:var(--err);background:var(--panel2)}
.add{border:1px dashed var(--line);background:none;width:100%;border-radius:6px;padding:4px;color:var(--mut);cursor:pointer;margin-top:4px}
.add:hover{color:var(--acc);border-color:var(--acc)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){font-family:var(--mono);font-size:12px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{border:1px solid var(--line);border-radius:20px;padding:2px 8px;background:none;cursor:pointer;font-size:11.5px;color:var(--mut)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
/* center */
#center{display:grid;grid-template-rows:var(--ldeh,45%) 6px 1fr;min-height:0;min-width:0}
.box{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.bh{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.bh b{font-size:12px;margin-right:6px}
.bt{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12px;white-space:nowrap}
.bt:hover{border-color:var(--acc);color:var(--acc)}
.bt svg{width:14px;height:14px}
.split{background:var(--line);cursor:row-resize;position:relative}
.split:hover,.split.drag{background:var(--acc)}
.vsplit{cursor:col-resize}
#ldew{overflow:auto;flex:1}
table.lde{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
.lde th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--mut);font-weight:500;text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
.lde td{border-bottom:1px solid var(--line);padding:0;height:27px;white-space:nowrap}
.lde tr.sel td{background:var(--sel)}
.lde tr:hover td{background:var(--panel2)}
.lde tr.sel:hover td{background:var(--sel)}
.lde td.n{color:var(--mut);text-align:center;width:34px;font-family:var(--mono);font-size:11.5px;cursor:pointer}
.lde td.ty{min-width:44px;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:0 4px;cursor:pointer}
.ty .b{display:inline-block;padding:1px 5px;border-radius:4px;background:var(--acc2);color:var(--acc)}
.ty .b.st{background:#fde68a;color:#92400e}
.ty .b{margin-right:2px}
.ty .b.de{background:#fce7f3;color:#9d174d}
.ty .b.fr{background:#dcfce7;color:#166534}
.ty .b.mi{background:#e5e7eb;color:#374151}
[data-theme=dark] .ty .b{margin-right:2px}
.ty .b.de{background:#fce7f3;color:#9d174d}
.ty .b.fr{background:#dcfce7;color:#166534}
.ty .b.mi{background:#374151;color:#e5e7eb}
.cell{display:flex;align-items:center;gap:2px;padding:0 3px}
.lde input{border:1px solid transparent;background:transparent;height:23px;padding:0 5px;border-radius:5px;font-family:var(--mono);font-size:12px;width:88px}
.lde select.el{border:1px solid transparent;background:transparent;height:23px;border-radius:5px;font-size:12px;padding:0 2px;max-width:118px;cursor:pointer}
.lde select.el:hover{border-color:var(--line)}
.lde input.c{font-family:inherit;width:120px}
.lde input.g{width:88px}
.lde input:hover{border-color:var(--line)}
.lde input:focus{border-color:var(--acc);background:var(--panel);outline:none}
.lde input.auto{color:var(--mut);font-style:italic}
.lde input:disabled{color:var(--mut);opacity:.6}
.lde input.bad{color:var(--err)}
.tg{border:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:10px;font-weight:700;width:18px;height:18px;border-radius:4px;cursor:pointer;padding:0;line-height:16px}
.tg.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tg.on.m{background:#7c3aed;border-color:#7c3aed}
.tg.on.l{background:#475569;border-color:#475569}
/* layout */
#layw{position:relative;flex:1;min-height:0}
#lay{position:absolute;inset:0;cursor:grab}
#lay.drag{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;font-family:var(--mono);z-index:5}
.legend{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;font-size:11px;color:var(--mut);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 8px;border-radius:6px}
/* analyses */
#an{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#panes{flex:1;display:grid;gap:6px;padding:6px;min-height:0}
#panes.g1{grid-template:1fr/1fr}
#panes.g2{grid-template:1fr 1fr/1fr}
#panes.g4{grid-template:1fr 1fr/1fr 1fr}
#panes.g6{grid-template:1fr 1fr 1fr/1fr 1fr}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;min-height:0;box-shadow:var(--shadow);overflow:hidden}
.pane.max{position:fixed;inset:56px 12px 36px 12px;z-index:40}
.ph{display:flex;align-items:center;gap:4px;padding:4px 6px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.ph select{height:24px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12px;padding:0 4px;max-width:100%}
.ph select.pt{font-weight:600;max-width:200px}
.ph label{font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:3px}
.pb{position:relative;flex:1;min-height:0}
.pb canvas{position:absolute;inset:0}
.phtml{position:absolute;inset:0;overflow:auto;padding:10px;font-size:12px;display:none}
.phtml table{border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.phtml td,.phtml th{white-space:nowrap;padding:2px 8px;border-bottom:1px solid var(--line);text-align:right}
.phtml th{color:var(--mut);font-weight:500;font-family:Inter,sans-serif}
.phtml h4{margin:12px 0 4px;font-size:12px}
.busy{position:absolute;right:8px;top:6px;font-size:11px;color:var(--mut)}
/* status */
footer{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden}
footer .err{color:var(--err);font-weight:600}
footer .k{font-family:var(--mono);color:var(--fg)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.38);display:none;align-items:center;justify-content:center;z-index:100}
.modal.open{display:flex}
.dlg{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(760px,94vw);max-height:90vh;display:flex;flex-direction:column}
.dlg>h2{margin:0;padding:14px 18px 6px;font-size:16px;display:flex;align-items:center}
.dlg>h2 .x{margin-left:auto;font-size:18px}
.dlg .db{padding:6px 18px 14px;overflow:auto}
.dlg .df{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.hn{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--fg)}
.hn:hover{background:var(--panel2)}.hn.on{background:var(--acc2);color:var(--acc);font-weight:600}
.help{font-size:13.5px;line-height:1.6}.help h3{margin:4px 0 8px;font-size:17px}.help h4{margin:14px 0 4px;font-size:13.5px}.help hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.help code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 4px;border-radius:4px}.help mark{background:#fde68a;color:#111;border-radius:2px}
table.ht{border-collapse:collapse;width:100%;font-size:12.5px}table.ht td,table.ht th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}table.ht th{color:var(--mut);font-weight:500}table.ht td:first-child{white-space:nowrap;font-weight:600}
.dlg.wide{width:min(1120px,96vw)}
.dlg textarea{width:100%;height:300px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel2);color:var(--fg)}
.hint{color:var(--mut);font-size:12px}
.vars{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 10px}
.vars span{background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 9px;font-size:11.5px;font-family:var(--mono)}
#mchart{position:absolute;inset:0;border:1px solid var(--line);border-radius:8px;display:block}
.big{font-family:var(--mono);font-size:18px;font-weight:600;white-space:nowrap}
.toast{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.toast.on{opacity:.95}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel2)}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="4.2" ry="10" stroke="#2563eb" stroke-width="1.8" fill="rgba(37,99,235,.15)"/><path d="M1 7.5 L12 9.5 L23 12 M1 16.5 L12 14.5 L23 12" stroke="#f59e0b" stroke-width="1.4"/></svg>
    Focale <small>conception optique</small>
  </div>
  <div class="dd"><button class="tb" data-menu="mFile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h10l6 6v10H4z"/><path d="M14 4v6h6"/></svg>Fichier ▾</button>
    <div class="menu" id="mFile">
      <button data-act="new">Nouveau système</button>
      <button data-act="open">Ouvrir… <span class="kb">Ctrl+O</span></button>
      <button data-act="save">Enregistrer (.json) <span class="kb">Ctrl+S</span></button>
      <button data-act="saveAs">Enregistrer sous…</button>
      <hr>
      <button data-act="dlSeq">Exporter CODE V (.seq)</button>
      <button data-act="import">Coller un système (JSON / .seq)…</button>
      <button data-act="export">Afficher / copier le texte (JSON / .seq)…</button>
      <hr>
      <button data-act="about">À propos / version</button>
    </div></div>
  <div class="dd"><button class="tb" data-menu="mSamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3c-3 4-3 14 0 18M12 3c3 4 3 14 0 18"/></svg>Exemples ▾</button>
    <div class="menu" id="mSamp"></div></div>
  <div class="sep"></div>
  <button class="tb" data-act="undo" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
  <button class="tb" data-act="redo" title="Rétablir (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
  <div class="sep"></div>
  <button class="tb pri" data-act="optim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l6-8 4 4 8-11"/><circle cx="21" cy="5" r="1.5" fill="currentColor"/></svg>Optimiser</button>
  <button class="tb" data-act="tol" title="Sensibilités et Monte-Carlo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18"/><path d="M6 20V10M10 20V4M14 20V8M18 20v-6"/></svg>Tolérancer</button>
  <div class="grow"></div>
  <span class="hint" style="margin-right:4px">Analyses</span>
  <div class="seg" id="gridSeg"><button data-g="1">1</button><button data-g="2">2</button><button data-g="4">4</button><button data-g="6">6</button></div>
  <button class="tb" id="btnInstall" data-act="install" style="display:none" title="Installer Focale comme application"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3h16v-3"/></svg>Installer</button>
  <button class="tb" data-act="theme" title="Thème clair / sombre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  <button class="tb" data-act="help" title="Aide">?</button>
</header>
<div id="ws">
  <aside id="side"></aside>
  <section id="center">
    <div class="box">
      <div class="bh">
        <b>Éditeur de lentilles</b>
        <button class="bt" data-act="insB" title="Insérer une surface avant la sélection">+ Avant</button>
        <button class="bt" data-act="insA" title="Insérer une surface après la sélection (Inser)">+ Après</button>
        <button class="bt" data-act="addLens" title="Ajouter une lentille (2 surfaces) après la sélection">+ Lentille</button>
        <button class="bt" data-act="del" title="Supprimer la surface sélectionnée">Supprimer</button>
        <button class="bt" data-act="stop" title="Placer le diaphragme sur la surface sélectionnée">Diaphragme</button>
        <button class="bt" data-act="mirror" title="Transformer la surface sélectionnée en miroir">Miroir</button>
        <button class="bt" data-act="flip" title="Retourner l'élément (de la sélection à la surface suivante)">Retourner</button>
        <button class="bt" data-act="glasses" title="Parcourir les catalogues de verres et affecter un verre">Verres…</button>
        <span class="grow"></span>
        <label class="hint"><input type="checkbox" id="showAsph"> Asphères</label>
      </div>
      <div id="ldew"><table class="lde" id="lde"></table></div>
    </div>
    <div class="split" id="hs"></div>
    <div class="box">
      <div class="bh">
        <b>Layout</b>
        <div class="seg" id="laySeg"><button data-m="2d" class="on">2D</button><button data-m="3d">3D</button></div>
        <span class="hint" style="margin-left:6px">Rayons</span>
        <select class="in" id="nRays" style="height:24px"><option>3</option><option>5</option><option selected>7</option><option>11</option><option>15</option></select>
        <button class="bt" data-act="fit" title="Ajuster la vue (double-clic)">Ajuster</button>
        <span class="grow"></span>
        <span class="hint">molette : zoom · glisser : déplacer · clic : sélectionner</span>
      </div>
      <div id="layw"><canvas id="lay"></canvas><div id="tip"></div><div class="legend" id="legend"></div></div>
    </div>
  </section>
  <div class="split vsplit" id="vs"></div>
  <section id="an"><div id="panes" class="g4"></div></section>
</div>
<footer id="status"></footer>
</div>

<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,.seq,.txt,.agf" style="display:none">
<div class="drop" id="drop">Déposez un fichier .json, .seq ou .agf</div>
<script>const FOCALE_VERSION = '98e1f937';</script>
<script>
'use strict';
/* =====================================================================
   FOCALE — moteur optique (tracé séquentiel réel + paraxial + diffraction)
   Conventions : unités mm, longueurs d'onde en µm, axe optique z,
   champ dans le plan YZ, convention de signes type Zemax/CODE V
   (épaisseurs négatives après un miroir).
   ===================================================================== */
const OE = (() => {
  const DEG = Math.PI / 180;

  /* ---------------- Verres : registre (catalogues fabricants + verres importés AGF) ---------------- */
  const SPECIAL = [
    ['F_SILICA', [0, 0.6961663, 0.004679148, 0.4079426, 0.01351206, 0.8974794, 97.934003], 0.21, 6.7],

<script>
'use strict';
/* Centre d'aide de Focale : chaque rubrique = { id, t (titre), h (HTML) } */
const HELP = [
  { id: 'demarrage', t: 'Démarrage rapide', h: `
<p>Focale est un logiciel de <b>conception optique séquentielle</b> : la lumière traverse les surfaces dans l'ordre de l'éditeur de lentilles, de l'objet (surface 0) à l'image (dernière surface).</p>
<ol>
<li><b>Chargez un exemple</b> (menu <i>Exemples</i>) ou partez de <i>Fichier → Nouveau système</i>.</li>
<li><b>Réglez le système</b> dans le panneau de gauche : ouverture, champs, longueurs d'onde.</li>
<li><b>Saisissez les surfaces</b> dans l'éditeur : rayon, épaisseur, verre. Choisissez le <b>type d'élément</b> (dioptre, miroir, réseau, lentille idéale, polariseur, lame d'onde) dans la colonne <i>Élément</i>.</li>
<li><b>Observez</b> le layout et les fenêtres d'analyse : tout se recalcule à chaque modification.</li>
<li><b>Optimisez</b> : cliquez sur <b>V</b> à côté des paramètres à faire varier, puis <i>Optimiser</i>.</li>
<li><b>Tolérancez</b> pour estimer la sensibilité à la fabrication, puis <b>enregistrez</b> (Ctrl+S).</li>
</ol>
<p class="hint">Astuce : double-cliquez sur l'en-tête d'une fenêtre d'analyse pour l'agrandir ; Échap pour revenir.</p>` },

  { id: 'interface', t: 'L\'interface', h: `
<ul>
<li><b>Barre du haut</b> : fichiers, exemples, annuler/rétablir, optimisation, tolérancement, nombre de fenêtres d'analyse (1, 2, 4, 6), thème clair/sombre, aide.</li>
<li><b>Panneau de gauche</b> : propriétés de la <b>surface sélectionnée</b> (type d'élément, forme, décentrements), puis ouverture, champs, longueurs d'onde et données paraxiales.</li>
<li><b>Éditeur de lentilles</b> (centre, en haut) : une ligne par surface.</li>
<li><b>Layout</b> (centre, en bas) : coupe 2D ou vue 3D. Molette = zoom, glisser = déplacer (3D : rotation ; Maj+glisser = déplacer), clic = sélectionner une surface, double-clic = ajuster.</li>
<li><b>Analyses</b> (droite) : chaque fenêtre a son propre choix d'analyse et ses réglages ; ⤓ enregistre l'image PNG, ⤢ agrandit.</li>
<li><b>Barre d'état</b> : focale, F/#, longueur, nombre de variables, avertissements et temps de calcul.</li>
</ul>
<p>Les séparateurs entre zones se déplacent à la souris. Le système et la disposition sont mémorisés automatiquement dans le navigateur.</p>` },

  { id: 'lde', t: 'Éditeur de lentilles', h: `
<table class="ht"><tr><th>Colonne</th><th>Signification</th></tr>
<tr><td>#</td><td>Numéro de surface (0 = objet, dernière = image).</td></tr>
<tr><td>Type</td><td>Badges : OBJ, IMA, STO (diaphragme), MIR (miroir), DEC/DAR/BEN (décentrement), XY/ZRN (forme libre). Double-clic : placer le diaphragme.</td></tr>
<tr><td>Élément</td><td>Fonction optique de la surface (voir <i>Types d'éléments</i>).</td></tr>
<tr><td>Rayon</td><td>Rayon de courbure en mm. « Infini », 0 ou vide = plan. R &gt; 0 : centre de courbure du côté +z.</td></tr>
<tr><td>Épaisseur</td><td>Distance jusqu'à la surface suivante (mm). Négative après un miroir. Pour l'objet : distance objet (« Infini » pour un objet à l'infini).</td></tr>
<tr><td>Verre</td><td>Milieu <b>après</b> la surface : vide/air, nom de catalogue (N-BK7, S-LAH79…), modèle <code>nd/νd</code> (ex. <code>1.5168/64.2</code>), indice fixe (<code>1.5</code>) ou <code>MIRROR</code>.</td></tr>
<tr><td>Demi-diamètre</td><td>Calculé automatiquement (italique) à partir des rayons ; 🔒 le fixe et vignette les rayons au-delà.</td></tr>
<tr><td>Conique</td><td>Constante de conicité k (0 sphère, −1 parabole, &lt;−1 hyperbole, ]−1,0[ ellipse).</td></tr>
<tr><td>A4…A10</td><td>Coefficients d'asphérique pair (case « Asphères »).</td></tr></table>
<p><b>Boutons</b> : <b>V</b> = variable d'optimisation ; <b>M</b> = solve de mise au point (épaisseur telle que le rayon marginal paraxial coupe l'axe à la surface suivante) ; 🔒 = demi-diamètre fixe.</p>
<p><b>Clavier</b> : Entrée valide et descend, Tab passe à la colonne suivante, flèches haut/bas, Échap annule, Inser insère une surface après la sélection, Ctrl+Suppr supprime.</p>
<p><b>Outils</b> : + Avant / + Après / + Lentille (deux surfaces N-BK7), Supprimer, Diaphragme, Miroir, Retourner (inverse un élément), Verres… (catalogue).</p>` },

  { id: 'elements', t: 'Types d\'éléments', h: `
<p>Choisissez le type dans la colonne <b>Élément</b> ; ses paramètres apparaissent dans le panneau <b>Surface</b> à gauche.</p>
<h4>Dioptre</h4><p>Surface réfractive classique entre deux milieux (loi de Snell-Descartes vectorielle). Le verre indiqué est celui qui suit la surface.</p>
<h4>Miroir</h4><p>Réflexion. Après un miroir la lumière repart vers −z : les épaisseurs suivantes sont négatives (convention CODE V / Zemax). Un miroir plan de renvoi se crée en un clic (« Miroir de renvoi 45° »).</p>
<h4>Réseau (T) et Réseau (R)</h4><p>Réseau de diffraction en transmission ou en réflexion, gravé sur la surface (plane ou courbe). Paramètres : <b>traits/mm</b>, <b>ordre m</b>, <b>orientation des traits</b> (0° : traits parallèles à X local, dispersion selon Y). Équation vectorielle : la composante tangentielle de n·<b>d</b> augmente de m·λ/d. Un ordre évanescent vignette le rayon. Le bouton « Aligner la suite sur l'ordre m » insère une surface d'axe basculée pour suivre le faisceau diffracté à la longueur d'onde primaire.</p>
<h4>Lentille idéale</h4><p>Lentille mince parfaite de focale f : chaque faisceau parallèle converge exactement en un point du plan focal (pas d'aberration). Utile pour modéliser un objectif ou un oculaire « parfait », ou pour étudier un sous-système isolément. Rayon et forme ignorés.</p>
<h4>Polariseur</h4><p>Polariseur linéaire idéal : ne transmet que la composante du champ électrique selon son axe (angle depuis X local). Respecte la loi de Malus.</p>
<h4>Lame d'onde</h4><p>Retardateur idéal : déphasage de 2π·retard (en ondes) entre l'axe lent et l'axe rapide (angle depuis X local). λ/4 à 45° d'une polarisation linéaire → circulaire ; λ/2 → rotation de la polarisation.</p>
<p class="hint">Polariseurs et lames d'onde n'affectent que la polarisation : utilisez l'analyse <i>Polarisation</i>. Les réseaux sont ignorés par le calcul paraxial (focale, pupilles).</p>` },

  { id: 'formes', t: 'Formes de surface', h: `
<p>Dans le panneau <b>Surface</b>, champ <i>Forme</i> :</p>
<h4>Standard</h4><p>z(r) = c·r² / (1 + √(1 − (1+k)c²r²)) + A4·r⁴ + A6·r⁶ + A8·r⁸ + A10·r¹⁰, avec c = 1/R.</p>
<h4>Polynôme XY</h4><p>Base standard + Σ cᵢⱼ·xⁱ·yʲ pour 1 ≤ i+j ≤ 6 (coordonnées locales, mm). Pour des surfaces de forme libre non symétriques (anamorphoseurs, correcteurs hors axe).</p>
<h4>Zernike (Fringe)</h4><p>Base standard + Σ cₖ·Zₖ(x/R, y/R) sur 16 termes Fringe (piston, basculements, défocalisation, astigmatismes, comas, sphérique, trèfles, ordres 5). R = rayon de normalisation ; cₖ en mm. Idéal pour représenter un défaut de surface mesuré.</p>
<p class="hint">L'intersection rayon/surface est résolue par la méthode de Newton. Les termes de forme libre ne sont pas pris en compte par le calcul paraxial ni par les coefficients de Seidel.</p>` },

  { id: 'decentrements', t: 'Décentrements et bascules', h: `
<p>Chaque surface peut être décentrée (X, Y, Z en mm) puis basculée (α autour de X, β autour de Y, γ autour de Z, en degrés, règle de la main droite, dans cet ordre).</p>
<ul>
<li><b>Décentrement simple (DEC)</b> : le nouvel axe est conservé pour les surfaces suivantes (comme un élément monté de travers dont tout ce qui suit dépend).</li>
<li><b>Décentrement et retour (DAR)</b> : seule cette surface est déplacée ; la suite reste sur l'axe d'origine.</li>
<li><b>Pliage (BEN)</b> : pour un miroir basculé de θ, l'axe suit le faisceau réfléchi (rotation 2θ). C'est ce qu'utilise « Miroir de renvoi 45° ».</li>
</ul>
<p>Le tracé réel se fait en coordonnées globales ; spots, fronts d'onde et footprints sont exprimés dans le repère local de la surface concernée. Les données paraxiales ignorent les décentrements.</p>` },

  { id: 'systeme', t: 'Ouverture, champs, longueurs d\'onde', h: `
<h4>Ouverture</h4><ul><li><b>Diamètre de la pupille d'entrée</b> (EPD), <b>F/# image</b> (objet à l'infini) ou <b>ouverture numérique objet</b> (objet à distance finie).</li>
<li><b>Obstruction centrale</b> : fraction du rayon de pupille masquée (télescopes à miroir secondaire).</li>
<li><b>Visée réelle des rayons</b> : chaque rayon est itéré pour viser exactement le diaphragme (utile pour les grands champs et les pupilles aberrantes) ; sinon visée paraxiale de la pupille d'entrée.</li></ul>
<h4>Champs</h4><p>Angles X/Y (°) pour un objet à l'infini (direction ∝ (tan X, tan Y, 1)), hauteurs X/Y (mm) sinon. Le poids sert à l'optimisation et au tolérancement.</p>
<h4>Longueurs d'onde</h4><p>En µm, avec poids et longueur d'onde <b>primaire</b> (pupilles, fronts d'onde par défaut, solves). Préréglages F-d-C, visible, 632,8 nm, NIR.</p>
<h4>Données paraxiales</h4><p>Focale effective, tirage, F/#, ouvertures numériques, positions et diamètres des pupilles, grandissement, invariant de Lagrange.</p>` },

  { id: 'verres', t: 'Verres et catalogues', h: `
<p>Plus de 1000 verres <b>Schott, Ohara, CDGM et Hoya</b> (base refractiveindex.info, domaine public), plus silice fondue et CaF₂. Bouton <b>Verres…</b> : recherche, filtre par fabricant, clic pour affecter le verre à la surface sélectionnée.</p>
<ul>
<li>Saisie libre avec auto-complétion ; tirets et casse ignorés (<code>nbk7</code> = N-BK7).</li>
<li>Homonymes : suffixe fabricant, ex. <code>F2_CDGM</code>. Les noms CODE V (<code>NBK7_SCHOTT</code>) sont reconnus.</li>
<li>Verre fictif : <code>nd/νd</code> (dispersion de Cauchy ajustée sur F, d, C) ou indice fixe.</li>
<li><b>Import AGF</b> (catalogue Zemax, formules 1 à 13) : glisser-déposer le fichier ou bouton « Importer un AGF… ». Les verres importés sont gardés dans le navigateur et embarqués dans les fichiers .json qui les utilisent.</li>
<li>Un avertissement s'affiche si une longueur d'onde sort du domaine de validité d'un verre.</li>
</ul>` },

  { id: 'analyses', t: 'Analyses', h: `
<table class="ht"><tr><th>Analyse</th><th>Description</th></tr>
<tr><td>Diagramme de spot</td><td>Impacts des rayons dans le plan image (grille de pupille), par champ, couleur = longueur d'onde. RMS et GEO par rapport au barycentre (ou au rayon principal), cercle d'Airy 1,22·λ·F/#.</td></tr>
<tr><td>Ray fan</td><td>Aberration transverse εy(Py) (tangentiel) et εx(Px) (sagittal) par rapport au rayon principal.</td></tr>
<tr><td>OPD fan</td><td>Écart de chemin optique (en ondes) le long des deux coupes de pupille.</td></tr>
<tr><td>Carte WFE</td><td>Front d'onde dans la pupille de sortie : OPD par rapport à une sphère de référence centrée sur l'image du rayon principal. RMS, PV, Strehl (Maréchal). Option : retrait du tilt.</td></tr>
<tr><td>Zernike</td><td>Décomposition du front d'onde sur 16 polynômes Fringe (moindres carrés).</td></tr>
<tr><td>PSF</td><td>Réponse impulsionnelle par FFT de la pupille complexe (64×64 dans 256×256), échelle linéaire ou log, rapport de Strehl.</td></tr>
<tr><td>FTM / MTF</td><td>Module de la fonction de transfert (FFT de la PSF), tangentiel et sagittal, polychromatique pondéré, avec limite de diffraction.</td></tr>
<tr><td>Énergie encerclée</td><td>Fraction d'énergie dans un cercle : diffraction (λ primaire) et géométrique (polychromatique), rayon à 80 %.</td></tr>
<tr><td>Footprint</td><td>Empreinte des faisceaux de chaque champ sur une surface, comparée au demi-diamètre (dimensionnement des optiques et montures).</td></tr>
<tr><td>Courbure de champ &amp; distorsion</td><td>Foyers tangentiel et sagittal en fonction du champ, distorsion en %.</td></tr>
<tr><td>Seidel</td><td>Coefficients du 3ᵉ ordre par surface (sphérique, coma, astigmatisme, Petzval, distorsion, chromatismes axial et latéral) et équivalents W040, W131…</td></tr>
<tr><td>Décalage focal chromatique</td><td>Position du foyer paraxial en fonction de λ.</td></tr>
<tr><td>Carte des verres</td><td>Diagramme nd / νd des catalogues, verres utilisés en orange.</td></tr>
<tr><td>Polarisation</td><td>Voir la rubrique dédiée.</td></tr>
<tr><td>Simulation d'image</td><td>Voir la rubrique dédiée.</td></tr>
<tr><td>Prescription</td><td>Tableau des surfaces, performances par champ, données paraxiales.</td></tr></table>` },

  { id: 'polarisation', t: 'Polarisation', h: `
<p>Focale suit le <b>champ électrique complexe 3D</b> le long de chaque rayon :</p>
<ul><li><b>Dioptres</b> : coefficients de Fresnel tₛ et tₚ (surfaces non traitées) si « Fresnel » est coché, sinon traitement antireflet parfait.</li>
<li><b>Miroirs</b> : réflexion métallique idéale (rₛ = −1, rₚ = +1).</li>
<li><b>Polariseurs et lames d'onde</b> : opérateurs idéaux (voir <i>Types d'éléments</i>).</li></ul>
<p>L'analyse <b>Polarisation</b> montre, pour chaque point de la pupille, l'ellipse de polarisation en sortie (orientation ψ, ellipticité χ ; noir = linéaire, rouge = elliptique droite, bleu = gauche) et la transmission en intensité (couleur). États d'entrée : linéaire X, Y, ±45°, circulaire droite/gauche, ou non polarisé (moyenne de X et Y, transmission seule).</p>
<p class="hint">Convention : polarisation exprimée dans le repère local de l'image ; circulaire droite = (1, −i)/√2 dans la base (X, Y).</p>` },

  { id: 'imgsim', t: 'Simulation d\'image', h: `
<p>L'analyse <b>Simulation d'image</b> montre ce que produit votre système à partir d'une scène :</p>
<ol><li>La scène (mire intégrée ou votre image via <i>Image…</i>) couvre le demi-champ choisi (par défaut le champ maximal du système).</li>
<li>Chaque point est envoyé à sa position image réelle par interpolation des <b>rayons principaux</b> : la <b>distorsion</b> et le <b>chromatisme latéral</b> sont inclus.</li>
<li>L'image est convoluée par une <b>PSF qui varie dans le champ</b> (grille 5×5, interpolation bilinéaire), calculée par diffraction ou, si le front d'onde dépasse 1,5 λ RMS, à partir du spot géométrique.</li>
<li>Les canaux <b>rouge, vert, bleu</b> utilisent respectivement la plus grande, la médiane et la plus petite longueur d'onde du système.</li>
<li>Le <b>vignetage</b> est pris en compte (fraction de pupille transmise).</li></ol>
<p>L'image est inversée comme dans un vrai objectif ; cochez « redresser » pour la remettre à l'endroit. Mires : résolution, texte, grille (distorsion), champ d'étoiles (PSF dans le champ), étoile de Siemens, damier, mire couleur (chromatisme).</p>
<p class="hint">Le calcul prend environ une seconde ; il est relancé automatiquement après une modification (ou avec ▶ Simuler).</p>` },

  { id: 'optimisation', t: 'Optimisation', h: `
<p>Méthode des <b>moindres carrés amortis</b> (Levenberg-Marquardt) avec Jacobien numérique.</p>
<ul><li><b>Variables</b> : bouton <b>V</b> sur les courbures, épaisseurs et coniques.</li>
<li><b>Critère de qualité image</b> : spot RMS par rapport au barycentre ou front d'onde RMS, évalué par quadrature de Gauss (3 anneaux × 8 bras) pour tous les champs et longueurs d'onde pondérés.</li>
<li><b>Opérandes</b> : focale (EFL), F/# de travail, longueur totale, tirage, distorsion, épaisseurs min/max de verre au centre et au bord, espace d'air minimal.</li></ul>
<p>« Restaurer l'état initial » annule l'optimisation ; Ctrl+Z fonctionne aussi. Raccourci : Ctrl+Maj+O.</p>` },

  { id: 'tolerancement', t: 'Tolérancement', h: `
<p>Estime la dégradation due aux défauts de fabrication et d'alignement.</p>
<ul><li><b>Tolérances</b> : rayon (%), épaisseur, indice, décentrement et bascule de surface, décentrement et bascule d'élément (pivot au sommet de sa 1ʳᵉ surface).</li>
<li><b>Critère</b> : front d'onde RMS (piston et tilt retirés) ou spot RMS.</li>
<li><b>Compensateur</b> : la mise au point (épaisseur avant l'image) est réoptimisée pour chaque cas.</li>
<li><b>Sensibilité</b> : chaque tolérance seule à ±, triée par impact ; estimation RSS du total.</li>
<li><b>Monte-Carlo</b> : toutes les tolérances tirées au hasard (gaussienne tronquée, uniforme ou extrêmes) ; histogramme, courbe cumulée, percentiles 50/80/90/98 % (rendement), plage du compensateur.</li></ul>
<p>« Copier le rapport » exporte les résultats au format CSV.</p>` },

  { id: 'fichiers', t: 'Fichiers et installation', h: `
<ul><li><b>Ctrl+O</b> ouvrir, <b>Ctrl+S</b> enregistrer (.json), <i>Enregistrer sous…</i>, export <b>CODE V (.seq)</b>, import .seq par ouverture ou copier-coller.</li>
<li><b>Glisser-déposer</b> d'un fichier .json, .seq ou .agf sur la fenêtre.</li>

  load();
  if (!App.sys) App.sys = normalize(SAMPLES['Triplet de Cooke f=50 F/5']());
  App.showAsph = App.sys.surfaces.some(s => s.a4 || s.a6 || s.a8 || s.a10); $('#showAsph').checked = App.showAsph;
  setupLDE(); setupSide(); setupLayout(); setupPanes(); setupDlg();
  pushHist(); buildPanes(); refresh();
  // header
  document.addEventListener('click', e => {
    const mb = e.target.closest('[data-menu]');
    $$('.menu').forEach(m => { if (!mb || m.id !== mb.dataset.menu) m.classList.remove('open'); });
    if (mb) { $('#' + mb.dataset.menu).classList.toggle('open'); return; }
    const sb = e.target.closest('[data-samp]'); if (sb) { loadSystem(SAMPLES[sb.dataset.samp](), 'Exemple chargé'); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    switch (a.dataset.act) {
      case 'new': FS.handle = null; loadSystem({ title: 'Nouveau système', aperture: { type: 'EPD', value: 10, obscuration: 0 }, fields: [{ y: 0, w: 1 }, { y: 5, w: 1 }], wavelengths: [{ um: 0.4861327, w: 1 }, { um: 0.5875618, w: 1 }, { um: 0.6562725, w: 1 }], primary: 1, rayAiming: false, merit: { image: 'SPOT', ops: [] },
        surfaces: [newSurf({ t: Infinity, comment: 'Objet' }), newSurf({ r: 50, t: 4, glass: 'N-BK7', stop: true }), newSurf({ r: -50, t: 45, tsolve: 'M' }), newSurf({ t: 0, comment: 'Image' })] }, 'Nouveau système'); break;
      case 'import': openImport(); break;
      case 'export': openExport(); break;
      case 'open': openFile(); break;
      case 'save': saveFile(false); break;
      case 'saveAs': saveFile(true); break;
      case 'dlSeq': download(fileBase() + '.seq', toSeq(App.sys), 'text/plain'); toast('Export CODE V téléchargé'); break;
      case 'about': openAbout(); break;
      case 'install': if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; $('#btnInstall').style.display = 'none'; }); } break;
      case 'undo': undo(); break; case 'redo': redo(); break;
      case 'optim': openOptim(); break;
      case 'tol': openTol(); break;
      case 'glasses': openGlasses(); break;
      case 'theme': { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? '' : 'dark'; save(); readTheme(); drawLayout(); renderPanes(); break; }
      case 'help': openHelp(); break;
      case 'fit': fitView(); break;
      default: lde(a.dataset.act);
    }
  });
  $('#gridSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { App.grid = +b.dataset.g; save(); buildPanes(); } });
  $('#laySeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; App.mode = b.dataset.m; drawLayout(); });
  $('#nRays').addEventListener('change', e => { App.nRays = +e.target.value; drawLayout(); });
  $('#showAsph').addEventListener('change', e => { App.showAsph = e.target.checked; renderLDE(); });
  $('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => importFile(f.name, t)); e.target.value = ''; });
  setupPlatform();
  const ii = document.createElement('input'); ii.type = 'file'; ii.accept = 'image/*'; ii.id = 'imgIn'; ii.style.display = 'none'; document.body.appendChild(ii);
  ii.addEventListener('change', e => { const f = e.target.files[0]; if (f) loadUserImage(f); e.target.value = ''; });
  document.addEventListener('keydown', e => {
    const inInput = e.target.closest && e.target.closest('input,textarea,select');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !inInput) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !inInput) { e.preventDefault(); redo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); e.shiftKey ? openOptim() : openFile(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(e.shiftKey); }
    else if (e.key === 'F1') { e.preventDefault(); openHelp(); }
    else if (e.key === 'Insert') { e.preventDefault(); lde('insA'); }
    else if ((e.ctrlKey || e.metaKey) && e.key === 'Delete') { e.preventDefault(); lde('del'); }
    else if (e.key === 'Escape') { closeDlg(); $$('.pane.max').forEach(p => { p.classList.remove('max'); renderPane(+p.dataset.i); }); }
  });
  // séparateurs
  const drag = (el, fn) => el.addEventListener('mousedown', e => { e.preventDefault(); el.classList.add('drag'); const mv = ev => fn(ev); const up = () => { el.classList.remove('drag'); window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); drawLayout(); renderPanes(); }; window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up); });
  drag($('#hs'), ev => { const r = $('#center').getBoundingClientRect(); const v = Math.max(80, Math.min(r.height - 120, ev.clientY - r.top)); $('#center').style.setProperty('--ldeh', v + 'px'); });
  drag($('#vs'), ev => { const r = $('#ws').getBoundingClientRect(); const v = Math.max(280, Math.min(r.width - 600, r.right - ev.clientX)); $('#ws').style.setProperty('--anw', v + 'px'); });
}
init();

</script>
</body>
</html>
