<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focale — Conception optique</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--panel:#fff;--panel2:#f7f9fb;--fg:#1c2430;--mut:#6b7686;--line:#dde3ea;--acc:#2563eb;--acc2:#e3ecfd;--grid:#eef1f5;--sel:#eaf1ff;--lens:rgba(96,165,250,.20);--lensE:#3b82f6;--warn:#b45309;--err:#dc2626;--ok:#15803d;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
[data-theme=dark]{color-scheme:dark;--bg:#0d1117;--panel:#151b23;--panel2:#11161d;--fg:#e6e9ee;--mut:#8b96a5;--line:#2a323d;--acc:#5b9cff;--acc2:#1b2c48;--grid:#1f2630;--sel:#18263b;--lens:rgba(96,165,250,.16);--lensE:#60a5fa;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
button,select,input{font:inherit;color:inherit}
select option,select optgroup{background:var(--panel);color:var(--fg)}

#app{display:grid;grid-template-rows:46px 1fr 26px;height:100vh}
/* header */
header{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
/* barre d'outils trop étroite : défilement horizontal (molette ou barre fine), menus positionnés hors de la barre */
header{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
header>*{flex:none}header>.grow{flex:1 1 0;min-width:8px}
header::-webkit-scrollbar{height:6px}header::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}header::-webkit-scrollbar-track{background:transparent}
header .menu.open{position:fixed;z-index:200}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:8px;white-space:nowrap}
.logo svg{flex:none}
.logo small{font-weight:500;color:var(--mut);font-size:11px}
.tb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border:1px solid transparent;border-radius:7px;background:none;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--panel2);border-color:var(--line)}
.tb.pri{background:var(--acc);color:#fff}
.tb.pri:hover{filter:brightness(1.08);background:var(--acc)}
.tb svg{width:16px;height:16px;flex:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.grow{flex:1}
.dd{position:relative}
.menu{position:absolute;top:34px;left:0;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:5px;min-width:250px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--acc2)}
.menu .kb{float:right;color:var(--mut);font-size:11px;margin-left:16px}
.drop{position:fixed;inset:0;background:rgba(37,99,235,.12);border:3px dashed var(--acc);z-index:300;display:none;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--acc)}
.drop.on{display:flex}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .mcat{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 10px 3px;border-top:1px solid var(--line);margin-top:4px}
#mSamp{max-height:calc(100vh - 90px);overflow-y:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 9px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--acc2);color:var(--acc);font-weight:600}
/* workspace */
#ws{display:grid;grid-template-columns:268px minmax(320px,1fr) 6px var(--anw,44%);min-height:0}
#side{overflow:auto;border-right:1px solid var(--line);background:var(--panel2);padding:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.card h3{margin:0;padding:8px 10px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.card h3 .chev{margin-left:auto;transition:transform .15s}
.card.closed h3 .chev{transform:rotate(-90deg)}
.card.closed .cb{display:none}
.cb{padding:2px 10px 10px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row label{flex:1;color:var(--mut)}
.in{height:26px;border:1px solid var(--line);border-radius:6px;padding:0 7px;background:var(--panel);min-width:0}
.in:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
.mini{width:74px}
table.mt{width:100%;border-collapse:collapse}
table.mt td,table.mt th{padding:2px 3px;text-align:left}
table.mt th{font-weight:500;color:var(--mut);font-size:11px}
table.mt input.in{width:100%}
.x{border:0;background:none;color:var(--mut);cursor:pointer;padding:2px 5px;border-radius:5px}
.x:hover{color:var(--err);background:var(--panel2)}
.add{border:1px dashed var(--line);background:none;width:100%;border-radius:6px;padding:4px;color:var(--mut);cursor:pointer;margin-top:4px}
.add:hover{color:var(--acc);border-color:var(--acc)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
label.zr{display:inline-flex;align-items:center;gap:4px}
label.zr input[type=range]{width:90px;accent-color:var(--acc)}
label.zr .zv{font-family:var(--mono);font-size:11px;min-width:38px}
.seg.sm button{height:22px;padding:0 7px;font-size:11.5px}
button.cpk{width:18px;height:18px;padding:0;border:1px solid var(--line);border-radius:5px;cursor:pointer;vertical-align:middle}
button.cpk:hover{outline:2px solid var(--acc);outline-offset:1px}
.cpop{position:fixed;z-index:250;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:10px 12px;width:248px;font-size:12.5px}
.cpop .cph{font-weight:600;margin-bottom:8px}
.cpop .cpg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:8px}
.cpop .cps{width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:5px;cursor:pointer;padding:0}
.cpop .cps.on{outline:2px solid var(--fg);outline-offset:1px}
.cpop .cpr{display:flex;align-items:center;gap:8px;margin:6px 0}
.cpop .cpr input[type=color]{width:30px;height:22px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;vertical-align:middle;cursor:pointer}
.cpop .cpv{width:34px;height:18px;border-radius:5px;border:1px solid var(--line)}
.cpop .cpf{display:flex;gap:6px;align-items:center;margin-top:10px}
input.cpk{-webkit-appearance:none;appearance:none;width:18px;height:18px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer;vertical-align:middle}
input.cpk::-webkit-color-swatch-wrapper{padding:0}
input.cpk::-webkit-color-swatch{border:none;border-radius:4px}
input.cpk::-moz-color-swatch{border:none;border-radius:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){font-family:var(--mono);font-size:12px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
/* Données système (façon CODE V) */
.sdw{padding:0!important;display:flex}
.sdg{display:grid;grid-template-columns:200px 1fr;flex:1;min-height:0}
.sdn{border-right:1px solid var(--line);background:var(--panel2);padding:8px 6px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.sdn button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;color:var(--fg);cursor:pointer;font-size:12.5px}
.sdn button:hover{background:var(--acc2)}
.sdn button.on{background:var(--acc);color:#fff}
.sdc{padding:8px 16px 16px;overflow:auto;min-width:0}
.sdc h3{font-size:13px;margin:12px 0 6px;color:var(--fg)}
.sdc h3:first-child{margin-top:4px}
.sdc .row{display:flex;align-items:center;gap:4px;margin:4px 0}
.sdc table.mt{width:auto}
.sdc table.mt input.in{width:auto}
table.sdt td:first-child{white-space:nowrap}
table.sdt td.ro,table.sdt th.ro{font-family:var(--mono);font-size:11.5px;color:var(--mut);text-align:right;padding-left:8px}
.sidebar-h{display:flex;align-items:center;gap:6px;margin:0 0 8px}
/* fenêtres détachées (panneaux d'analyse, éditeur, layout, panneau système) */
.fwin{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;min-width:260px;min-height:140px}
.fwin>.fwh{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;cursor:move;user-select:none;border-bottom:1px solid var(--line);background:var(--panel2);font-size:12.5px;flex:none}
.fwin>.fwh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwin>.fwb{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.fwin>.fwb>*{flex:1;min-height:0}
.fwin>.fwb>.pane{border:0;border-radius:0;box-shadow:none}
.fwin>.fwb>#side{border:0;overflow:auto}
.fwin .grip{position:absolute;right:2px;bottom:2px;width:14px;height:14px;cursor:nwse-resize;opacity:.55;z-index:3;background:linear-gradient(135deg,transparent 0 45%,var(--mut) 45% 52%,transparent 52% 65%,var(--mut) 65% 72%,transparent 72%)}
.fwin.min{height:auto!important;min-height:0}
.fwin.min>.fwb,.fwin.min>.grip{display:none}
.fwin .wb{border:0;background:none;color:var(--mut);cursor:pointer;width:26px;height:24px;border-radius:6px;font-size:14px;line-height:1}
.fwin .wb:hover{background:var(--acc2);color:var(--fg)}
body.wdrag .fwin .fwb{pointer-events:none}
.fwin button[data-fw]{display:none}
.help .hflash,.help tr.hflash td{background:var(--acc2)!important;transition:background .4s}
button.x.hb{font-weight:700;font-size:12.5px}
.nrc{display:inline-flex;align-items:center;gap:2px}
.nrc>.bt{height:24px;padding:0 6px}
.nrc .menu{top:28px}
.nrc .menu button{white-space:nowrap}
.fwin #ldeBox .bh>b,.fwin #layBox .bh>b{display:none}
.chip{border:1px solid var(--line);border-radius:20px;padding:2px 8px;background:none;cursor:pointer;font-size:11.5px;color:var(--mut)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
/* center */
#center{display:grid;grid-template-rows:var(--ldeh,45%) 6px 1fr;min-height:0;min-width:0}
.box{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.bh{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.bh b{font-size:12px;margin-right:6px}
.bt{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12px;white-space:nowrap}
.bt:hover{border-color:var(--acc);color:var(--acc)}
.bt svg{width:14px;height:14px}
.split{background:var(--line);cursor:row-resize;position:relative}
.split:hover,.split.drag{background:var(--acc)}
.vsplit{cursor:col-resize}
#ldew{overflow:auto;flex:1}
table.lde{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
.lde th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--mut);font-weight:500;text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
.lde td{border-bottom:1px solid var(--line);padding:0;height:27px;white-space:nowrap}
.lde tr.sel td{background:var(--sel)}
.lde tr:hover td{background:var(--panel2)}
.lde tr.sel:hover td{background:var(--sel)}
.lde td.n{color:var(--mut);text-align:center;width:34px;font-family:var(--mono);font-size:11.5px;cursor:pointer}
.lde td.ty{min-width:44px;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:0 4px;cursor:pointer}
.ty .b{display:inline-block;padding:1px 5px;border-radius:4px;background:var(--acc2);color:var(--acc)}
.ty .b.st{background:#fde68a;color:#92400e}
.ty .b{margin-right:2px}
.ty .b.de{background:#fce7f3;color:#9d174d}
.ty .b.fr{background:#dcfce7;color:#166534}
.ty .b.mi{background:#e5e7eb;color:#374151}
[data-theme=dark] .ty .b{margin-right:2px}
.ty .b.de{background:#fce7f3;color:#9d174d}
.ty .b.fr{background:#dcfce7;color:#166534}
.ty .b.mi{background:#374151;color:#e5e7eb}
.cell{display:flex;align-items:center;gap:2px;padding:0 3px}
.lde input{border:1px solid transparent;background:transparent;height:23px;padding:0 5px;border-radius:5px;font-family:var(--mono);font-size:12px;width:84px}
.lde select.el{border:1px solid transparent;background:transparent;height:23px;border-radius:5px;font-size:12px;padding:0 2px;max-width:96px;cursor:pointer}
.lde select.el:hover{border-color:var(--line)}
.lde input.c{font-family:inherit;width:84px}
.lde input.g{width:96px}
.lde input.g.model{color:var(--acc);font-style:italic}
.lde input:hover{border-color:var(--line)}
.lde input:focus{border-color:var(--acc);background:var(--panel);outline:none}
.lde input.auto{color:var(--mut);font-style:italic}
.lde input:disabled{color:var(--mut);opacity:.6}
.lde input.bad{color:var(--err)}
.tg{border:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:10px;font-weight:700;width:18px;height:18px;border-radius:4px;cursor:pointer;padding:0;line-height:16px}
.tg.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tg.on.m{background:#7c3aed;border-color:#7c3aed}
.tg.on.l{background:#475569;border-color:#475569}
/* layout */
#layw{position:relative;flex:1;min-height:0}
#lay{position:absolute;inset:0;cursor:grab}
#lay.drag{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;font-family:var(--mono);z-index:5}
.legend{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;font-size:11px;color:var(--mut);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 8px;border-radius:6px}
/* analyses */
#an{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#panes{flex:1;display:grid;gap:6px;padding:6px;min-height:0}
#panes.g1{grid-template:1fr/1fr}
#panes.g2{grid-template:1fr 1fr/1fr}
#panes.g4{grid-template:1fr 1fr/1fr 1fr}
#panes.g6{grid-template:1fr 1fr 1fr/1fr 1fr}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;min-height:0;box-shadow:var(--shadow);overflow:hidden}
.pane.max{position:fixed;inset:56px 12px 36px 12px;z-index:40}
.ph{display:flex;align-items:center;gap:4px;padding:4px 6px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.ph select{height:24px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12px;padding:0 4px;max-width:100%}
.ph select.pt{font-weight:600;max-width:200px}
.ph label{font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:3px}
.pb{position:relative;flex:1;min-height:0}
.pb canvas{position:absolute;inset:0}
.phtml{position:absolute;inset:0;overflow:auto;padding:10px;font-size:12px;display:none}
.phtml table{border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.phtml td,.phtml th{white-space:nowrap;padding:2px 8px;border-bottom:1px solid var(--line);text-align:right}
.phtml th{color:var(--mut);font-weight:500;font-family:Inter,sans-serif}
.phtml h4{margin:12px 0 4px;font-size:12px}
.busy{position:absolute;right:8px;top:6px;font-size:11px;color:var(--mut)}
/* status */
footer{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden}
footer .err{color:var(--err);font-weight:600}
footer .k{font-family:var(--mono);color:var(--fg)}
footer #bgst{display:inline-flex;align-items:center;gap:5px;color:var(--acc)}
.bgspin{width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:bgsp .8s linear infinite;display:inline-block}
@keyframes bgsp{to{transform:rotate(360deg)}}
.mcbar{display:inline-flex;align-items:center;gap:2px}.mcbar select{height:26px;max-width:150px;border:1px solid var(--acc);border-radius:6px;background:var(--acc2);color:var(--fg);font-weight:600}.mcbar .tb{padding:0 6px}
.lde input.mcc{box-shadow:inset 3px 0 0 #a855f7;color:#a855f7;font-weight:600}
.mct td,.mct th{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}.mct select{max-width:180px}
/* modal */
.modal{position:fixed;inset:0;display:none;z-index:100;pointer-events:none}
.modal.open{display:block}
.dlg{position:absolute;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:min(760px,94vw);max-height:90vh;min-width:300px;display:flex;flex-direction:column;overflow:hidden}
.dlg>h2{margin:0;padding:12px 10px 6px 18px;font-size:16px;display:flex;align-items:center;gap:6px;cursor:move;user-select:none;flex:none}
.dlg>h2 .wctl{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.dlg>h2 .x{font-size:18px}
.dlg .wb{border:0;background:none;color:var(--mut);cursor:pointer;width:28px;height:26px;border-radius:6px;font-size:15px;line-height:1}
.dlg .wb:hover,.dlg>h2 .x:hover{background:var(--acc2);color:var(--fg)}
.dlg .db{padding:6px 18px 14px;overflow:auto;flex:1 1 auto;min-height:0}
.dlg .grip{position:absolute;right:2px;bottom:2px;width:14px;height:14px;cursor:nwse-resize;opacity:.55;background:linear-gradient(135deg,transparent 0 45%,var(--mut) 45% 52%,transparent 52% 65%,var(--mut) 65% 72%,transparent 72%)}
.dlg.min{height:auto!important;width:320px!important;min-height:0;max-height:none}
.dlg.min>*:not(h2){display:none!important}
.dlg.min>h2{padding-bottom:10px}
.dlg.maxi{left:10px!important;top:10px!important;width:calc(100vw - 20px)!important;height:calc(100vh - 20px)!important;max-height:none}
.dlg.maxi .grip{display:none}
body.wdrag,body.wdrag *{user-select:none!important}
table.gtab tr[data-g]{cursor:pointer}
table.gtab tr[data-g]:hover td{background:var(--acc2)}
table.gtab tr.gcur td{background:color-mix(in srgb,var(--acc) 9%,transparent)}
table.gtab tr.gcur td:first-child b::after{content:' · actuel';font-weight:500;color:var(--mut);font-size:11px}
table.gtab tr.gsel td,table.gtab tr.gsel:hover td{background:var(--acc);color:#fff}
table.gtab tr.gsel td *{color:#fff!important}
.menu.ctx{position:fixed;top:0;left:0;z-index:200;min-width:270px}
.menu button:disabled{opacity:.4;cursor:default;background:none}
.menu button.danger:not(:disabled){color:#dc2626}
.menu button.danger:not(:disabled):hover{background:rgba(220,38,38,.1)}
.dlg .df{flex:none;padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.hn{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--fg)}
.hn:hover{background:var(--panel2)}.hn.on{background:var(--acc2);color:var(--acc);font-weight:600}
.help{font-size:13.5px;line-height:1.6}.help td.fm{font-family:'STIX Two Text',Cambria,Georgia,'Times New Roman',serif;font-size:14.5px;white-space:normal;min-width:200px}.help table.ht{margin:4px 0 10px}.help h3{margin:4px 0 8px;font-size:17px}.help h4{margin:14px 0 4px;font-size:13.5px}.help hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.help code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 4px;border-radius:4px}.help mark{background:#fde68a;color:#111;border-radius:2px}
table.ht{border-collapse:collapse;width:100%;font-size:12.5px}table.ht td,table.ht th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}table.ht th{color:var(--mut);font-weight:500}table.ht td:first-child{white-space:nowrap;font-weight:600}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px;font-size:12.5px}.rgrid label{display:flex;align-items:center;gap:5px;padding:2px 0;cursor:pointer}
.dlg.wide{width:min(1120px,96vw)}
.dlg textarea{width:100%;height:300px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel2);color:var(--fg)}
.hint{color:var(--mut);font-size:12px}
.vars{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 10px}
.ogrid{display:grid;grid-template-columns:minmax(290px,322px) minmax(0,1fr);gap:16px;flex:1;min-height:0}
.ofrm{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:12.5px}.ofrm>label{color:var(--mut)}.ofrm select.in{width:100%}
table.obnd{font-size:12px;border-collapse:collapse}table.obnd th{font-weight:500;color:var(--mut);padding:2px 4px;font-size:11px}table.obnd td{padding:1px 4px}
table.otab td,table.otab th{padding:2px 3px}table.otab th{font-size:11px;white-space:nowrap}table.otab input.in,table.otab select.in{height:22px;font-size:12px;padding:0 3px}
.opb{font-family:var(--mono);font-weight:600;font-size:12px;height:22px;min-width:52px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:5px;cursor:pointer}.opb:hover{border-color:var(--acc)}
td.odc{max-width:170px}.odesc{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;font-size:11.5px;color:var(--mut)}td.odc select{margin-left:4px}
td.onum{color:var(--mut);font-family:var(--mono);font-size:11px;text-align:right}td.oact{white-space:nowrap}td.oact .x{width:18px;height:20px;font-size:11px}
tr.oauto td.onum{color:var(--acc)}tr.oimg td{background:var(--panel2)}
.orow select.in{width:auto}.opick{position:absolute;z-index:50;width:450px;max-height:410px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.45);padding:8px}
.opick #opl{overflow:auto;flex:1}.opick .opg{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:6px 4px 2px}
.opick button{display:grid;grid-template-columns:54px 1fr;gap:0 8px;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:3px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}.opick button:hover{background:var(--panel2)}
.opick button b{font-family:var(--mono)}.opick button i{grid-column:2;font-style:normal;font-size:11px;color:var(--mut)}
.oL,.oR{display:flex;flex-direction:column;min-height:0;min-width:0}
.oL{overflow:auto;padding-right:4px}
.akst{font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--mut)}.akst.ok{background:rgba(22,163,74,.15);color:#16a34a;font-weight:600}.akst.ko{background:rgba(220,38,38,.14);color:#dc2626;font-weight:600}
.svov{position:fixed;inset:0;z-index:400;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center}.svbox{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4);padding:16px 18px;width:min(460px,92vw)}.svbox h3{margin:0 0 10px;font-size:15px}.svbox label{font-size:12px;opacity:.8;display:block;margin-bottom:4px}
.pvw{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.72);display:none;flex-direction:column}.pvw.open{display:flex}.pvh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}.pvb{flex:1;overflow:auto;padding:18px 0;display:flex;flex-direction:column;align-items:center;gap:16px}.pvp{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35);flex:none}.pvp canvas{display:block}.pvn{position:absolute;right:8px;bottom:6px;font-size:11px;color:#6b7686;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:8px}
.gtip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11.5px;box-shadow:var(--shadow);z-index:5;max-width:230px}
.hlist{flex:1;overflow:auto;border:1px solid var(--line);border-radius:8px;min-height:120px}.hrow{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}.hrow:hover{background:var(--panel2)}.hrow.cur{background:var(--sel);font-weight:600}.hrow.fut{opacity:.5}.hrow .hn{width:28px;color:var(--mut);font-family:var(--mono)}.hrow .ht{width:62px;color:var(--mut);font-family:var(--mono)}.hrow .hl{flex:1;min-width:0}
.owt{display:flex;flex-wrap:wrap;gap:4px 8px;margin:3px 0}.owt label{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--mut)}.owt input{width:46px;height:22px}
.osol{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0;border-bottom:1px solid var(--line)}.osol .mono{font-family:var(--mono)}
.oscroll{overflow:auto;border:1px solid var(--line);border-radius:8px;margin:4px 0;min-height:60px;max-height:100%;flex:0 1 auto}
.oR .oscroll{flex:1 1 auto}
table.otab select.in{max-width:210px}
table.otab td.ov{font-family:var(--mono);font-size:11.5px;white-space:nowrap;text-align:right}
.qfb{display:inline-flex}.qfb .bt:first-child{border-top-right-radius:0;border-bottom-right-radius:0}.qfb .bt:last-child{border-top-left-radius:0;border-bottom-left-radius:0;border-left:0;padding:0 5px}
#dlg .db:has(.ogrid){display:flex;flex-direction:column}
.orow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12.5px}.orow>*{flex:none}
.vars span{background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 9px;font-size:11.5px;font-family:var(--mono)}
#mchart{position:absolute;inset:0;border:1px solid var(--line);border-radius:8px;display:block}
.big{font-family:var(--mono);font-size:18px;font-weight:600;white-space:nowrap}
.tolg{display:grid;grid-template-columns:minmax(330px,380px) minmax(0,1fr);gap:18px;flex:1;min-height:0}
.tolL,.tolR{display:flex;flex-direction:column;min-height:0;min-width:0}
.tolL>#tolL,.tolR>#tolres{flex:1;min-height:0;overflow:auto;padding-top:8px}
.tseg{align-self:flex-start;flex:none}
.th4{margin:12px 0 4px;font-size:12.5px}
.ck{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12.5px;cursor:pointer}
.tkpi{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:6px}
.tscroll{max-height:none;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:4px}
table.tlist input.in{width:76px}
table.tlist tr.off td{opacity:.45}
#dlg .db:has(.tolg){display:flex;flex-direction:column}
.toast{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.toast.on{opacity:.95}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel2)}
</style>

<body>
<div id="app">
<header>
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 26 26" role="img" aria-label="Focale"><rect width="26" height="26" rx="6" fill="#0f172a"/><g transform="translate(3.5 3.5) scale(.19)"><circle cx="50" cy="50" r="44" fill="none" stroke="#263f64" stroke-width="5"/><circle cx="50" cy="50" r="31" fill="none" stroke="#3c659c" stroke-width="6"/><circle cx="50" cy="50" r="16" fill="#60a5fa"/><circle cx="50" cy="50" r="6" fill="#f59e0b"/></g></svg>
    Focale <small>conception optique</small>
  </div>
  <div class="dd"><button class="tb" data-menu="mFile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h10l6 6v10H4z"/><path d="M14 4v6h6"/></svg>Fichier ▾</button>
    <div class="menu" id="mFile">
      <button data-act="new">Nouveau système</button>
      <button data-act="open">Ouvrir <span class="kb">Ctrl+O</span></button>
      <button data-act="save">Enregistrer (.json) <span class="kb">Ctrl+S</span></button>
      <button data-act="saveAs">Enregistrer sous</button>
      <hr>
      <button data-act="dlZmx">Exporter Zemax (.zmx)</button>
      <button data-act="dlSeq">Exporter CODE V (.seq)</button>
      <button data-act="import">Importer un système (Zemax / CODE V / JSON)</button>
      <button data-act="export">Afficher / copier le texte (JSON / .zmx / .seq)</button>
      <hr>
      <button data-act="report">Rapport PDF</button>
      <button data-act="tolrpt">Rapport de tolérancement (PDF)</button>
      <button data-act="drawings">Plans de fabrication ISO 10110 (PDF)</button>
      <hr>
      <button data-act="asstShow" id="asstShow">Masquer le bouton Assistant</button>
      <button data-act="about">À propos / version</button>
    </div></div>
  <div class="dd"><button class="tb" data-menu="mSamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3c-3 4-3 14 0 18M12 3c3 4 3 14 0 18"/></svg>Exemples ▾</button>
    <div class="menu" id="mSamp"></div></div>
  <div class="sep"></div>
  <button class="tb" data-act="undo" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
  <button class="tb" data-act="redo" title="Rétablir (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
  <button class="tb" data-act="hist" title="Historique des modifications et points de sauvegarde (Ctrl+H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
  <div class="sep"></div>
  <button class="tb" data-act="sysdata" title="Données système (CODE V) : pupille, longueurs d'onde, champs et vignetage, température et pression, matériaux — Ctrl+Maj+D"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Système</button>
  <button class="tb" data-act="mconf" title="Multi-configuration (zoom, mise au point…) — Ctrl+Maj+M"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17.5h7M17.5 14v7"/></svg>Configs</button>
  <span id="mcbar" class="mcbar" style="display:none"></span>
  <div class="sep"></div>
  <button class="tb pri" data-act="optim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l6-8 4 4 8-11"/><circle cx="21" cy="5" r="1.5" fill="currentColor"/></svg>Optimiser</button>
  <button class="tb" data-act="tol" title="Sensibilités et Monte-Carlo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18"/><path d="M6 20V10M10 20V4M14 20V8M18 20v-6"/></svg>Tolérancer</button>
  <div class="dd"><button class="tb" data-menu="mRpt" title="Documents PDF : rapport de conception, rapport de tolérancement, plans de fabrication"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h7M9 17h5"/></svg>Rapport ▾</button>
    <div class="menu" id="mRpt">
      <button data-act="report">Rapport de conception</button>
      <button data-act="tolrpt">Rapport de tolérancement</button>
      <button data-act="drawings">Plans de fabrication ISO 10110</button>
    </div></div>
  <button class="tb" data-act="assistant" id="asstBtn" title="Assistant en langage naturel (module facultatif, modèle local) — Ctrl+Maj+A"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/></svg>Assistant</button>
  <div class="grow"></div>
  <span class="hint" style="margin-right:4px">Analyses</span>
  <button class="tb" data-act="newpane" title="Ouvrir une analyse supplémentaire dans une fenêtre flottante">+ Fenêtre</button>
  <div class="seg" id="gridSeg"><button data-g="1">1</button><button data-g="2">2</button><button data-g="4">4</button><button data-g="6">6</button></div>
  <button class="tb" id="btnInstall" data-act="install" style="display:none" title="Installer Focale comme application"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3h16v-3"/></svg>Installer</button>
  <button class="tb" data-act="theme" title="Thème clair / sombre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  <button class="tb" data-act="help" title="Aide">?</button>
</header>
<div id="ws">
  <aside id="side"></aside>
  <section id="center">
    <div class="box" id="ldeBox">
      <div class="bh">
        <b>Éditeur de lentilles</b>
        <button class="bt" data-act="insB" title="Insérer une surface avant la sélection">+ Avant</button>
        <button class="bt" data-act="insA" title="Insérer une surface après la sélection (Inser)">+ Après</button>
        <button class="bt" data-act="addLens" title="Ajouter une lentille (2 surfaces) après la sélection">+ Lentille</button>
        <button class="bt" data-act="del" title="Supprimer la surface sélectionnée">Supprimer</button>
        <button class="bt" data-act="stop" title="Placer le diaphragme sur la surface sélectionnée">Diaphragme</button>
        <button class="bt" data-act="mirror" title="Transformer la surface sélectionnée en miroir">Miroir</button>
        <button class="bt" data-act="flip" title="Retourner l'élément (de la sélection à la surface suivante)">Retourner</button>
        <button class="bt" data-act="glasses" title="Parcourir les catalogues de verres et affecter un verre">Verres</button>
        <span class="qfb"><button class="bt" data-act="qfocus" title="Quick focus : déplace l'image au meilleur foyer (Ctrl+Maj+F)">⌖ Quick focus</button><button class="bt" data-act="qfopt" title="Options du quick focus : critère et longueur d'onde" aria-label="Options du quick focus">▾</button></span>
        <span class="grow"></span>
        <label class="hint"><input type="checkbox" id="showAsph"> Asphères</label>
        <label class="hint" title="Coefficients d'ordre élevé A12 à A20 (r¹² … r²⁰)"><input type="checkbox" id="showHi"> A12–A20</label>
        <button class="x" data-help="lde" title="Aide sur l'éditeur de lentilles">?</button>
        <button class="x" data-fw="lde" title="Détacher l'éditeur dans une fenêtre flottante (déplaçable, redimensionnable)">⧉</button>
      </div>
      <div id="ldew"><table class="lde" id="lde"></table></div>
    </div>
    <div class="split" id="hs"></div>
    <div class="box" id="layBox">
      <div class="bh">
        <b>Layout</b>
        <div class="seg" id="laySeg"><button data-m="2d" class="on">2D</button><button data-m="3d">3D</button></div>
        <span class="hint" style="margin-left:6px">Rayons</span>
        <span class="dd nrc"><input class="in" id="nRays" type="number" min="3" max="100" step="1" value="7" style="height:24px;width:58px" title="Nombre de rayons par champ : un entier de 3 à 100 (Entrée pour valider, flèches ou molette pour ajuster), ou ▾ pour une valeur courante"><button class="bt" data-menu="nRaysMenu" title="Valeurs courantes" aria-label="Valeurs courantes du nombre de rayons">▾</button>
          <div class="menu" id="nRaysMenu" style="min-width:110px"><button data-nr="3">3 rayons</button><button data-nr="5">5 rayons</button><button data-nr="7">7 rayons</button><button data-nr="11">11 rayons</button><button data-nr="15">15 rayons</button><button data-nr="21">21 rayons</button><button data-nr="31">31 rayons</button><button data-nr="51">51 rayons</button></div></span>
        <select class="in" id="ray3" style="height:24px;display:none" title="Motif des rayons dans la vue 3D : éventails X et Y (croix, « XY fan » de Zemax), éventail Y seul, anneau au bord de la pupille ou grille remplissant la pupille"></select>
        <button class="bt" data-act="fit" title="Ajuster la vue (double-clic)">Ajuster</button>
        <span class="grow"></span>
        <span class="hint">molette : zoom · glisser : déplacer · clic : sélectionner</span>
        <button class="x" data-help="interface" data-ha="Layout" title="Aide sur le layout">?</button>
        <button class="x" data-fw="lay" title="Détacher le layout dans une fenêtre flottante (déplaçable, redimensionnable)">⧉</button>
      </div>
      <div id="layw"><canvas id="lay"></canvas><div id="tip"></div><div class="legend" id="legend"></div></div>
    </div>
  </section>
  <div class="split vsplit" id="vs"></div>
  <section id="an"><div id="panes" class="g4"></div></section>
</div>
<footer id="status"></footer>
</div>
